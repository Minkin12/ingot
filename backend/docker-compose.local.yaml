services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ingot
      POSTGRES_USER: ingot
      POSTGRES_PASSWORD: devpassword
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    volumes:
      - ./.data/nats:/data
    ports:
      - "4222:4222"