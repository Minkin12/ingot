services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${INGOT_DB_NAME}
      POSTGRES_USER: ${INGOT_DB_USER}
      POSTGRES_PASSWORD: ${INGOT_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    ports:
      - "4222:4222"
    volumes:
      - ./.data/nats:/data