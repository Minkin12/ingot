services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${INGOT_DB_NAME}
      POSTGRES_USER: ${INGOT_DB_USER}
      POSTGRES_PASSWORD: ${INGOT_DB_PASSWORD}
    volumes:
      - ./.data/postgres:/var/lib/postgresql/data
    restart: unless-stopped

  nats:
    image: nats:latest
    command: ["-js", "-sd", "/data"]
    volumes:
      - ./.data/nats:/data
    restart: unless-stopped

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      SPRING_PROFILES_ACTIVE: ${INGOT_SPRING_PROFILES_ACTIVE}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${INGOT_DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${INGOT_DB_USER}
      SPRING_DATASOURCE_PASSWORD: ${INGOT_DB_PASSWORD}
      NATS_URL: nats://nats:4222
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - nats
    restart: unless-stopped